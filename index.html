<!doctype html>
<html>
  <head>
    <title>Music Visualizer</title>
    <link rel="stylesheet" href="flexbox.css" />
  </head>
  <body>
    <div class="music-start" id="musicStart">
      <button id="startMusic">▶ Start Visualizer</button>
    </div>

    <div class="youtube-background">
      <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/Y-sdz_i9KnI?enablejsapi=1&autoplay=0&loop=1&playlist=Y-sdz_i9KnI&playsinline=1"
        title="Hintergrundmusik"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
      >
      </iframe>
    </div>

    <div class="parent">
      <div class="happyChild"></div>
      <div class="rightSide">
        <div class="madChild"></div>
        <div class="bottomrow">
          <div class="child1"></div>
          <div class="child2"></div>
          <div class="child3"></div>
        </div>
      </div>
    </div>

    <script src="visualizer.js"></script>
  </body>
</html>
